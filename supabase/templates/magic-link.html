<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 PASSEPORT</title>
</head>
<body style="margin:0;padding:0;background-color:#FAF8F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#FAF8F5;padding:40px 20px;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background-color:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <!-- Header -->
          <tr>
            <td style="background-color:#2C2825;padding:32px 40px;text-align:center;">
              <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px;letter-spacing:2px;color:#FAF8F5;">
                PASSEPORT
              </h1>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:40px;">
              <h2 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:22px;color:#2C2825;letter-spacing:0.5px;">
                一鍵登入
              </h2>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.7;color:#8B8178;">
                點擊下方按鈕即可安全登入你的 PASSEPORT 帳號，無需輸入密碼。
              </p>
              <!-- CTA Button -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding:8px 0 32px;">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;background-color:#2C2825;color:#FAF8F5;text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:14px 36px;border-radius:50px;font-weight:500;">
                      登入 PASSEPORT
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 8px;font-size:12px;color:#B5ADA6;">
                如果按鈕無法點擊，請複製以下連結到瀏覽器：
              </p>
              <p style="margin:0 0 24px;font-size:11px;color:#B5ADA6;word-break:break-all;">
                {{ .ConfirmationURL }}
              </p>
              <p style="margin:0;font-size:12px;color:#E8927C;">
                此連結僅能使用一次，並將在 1 小時後失效。
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px;border-top:1px solid #EFECE8;text-align:center;">
              <p style="margin:0;font-size:11px;color:#B5ADA6;letter-spacing:1px;">
                PASSEPORT &mdash; Your Style Passport
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
